<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#080e1a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Radial Glow Accents -->
  <circle cx="200" cy="180" r="180" fill="#0284c7" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1080" cy="540" r="220" fill="#f59e0b" opacity="0.12" filter="url(#glow)"/>

  <!-- Grid overlay -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="720"/>
    <line x1="240" y1="0" x2="240" y2="720"/>
    <line x1="400" y1="0" x2="400" y2="720"/>
    <line x1="560" y1="0" x2="560" y2="720"/>
    <line x1="720" y1="0" x2="720" y2="720"/>
    <line x1="880" y1="0" x2="880" y2="720"/>
    <line x1="1040" y1="0" x2="1040" y2="720"/>
    <line x1="1200" y1="0" x2="1200" y2="720"/>
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
  </g>

  <!-- Top Header Badge -->
  <rect x="80" y="60" width="220" height="36" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
  <circle cx="102" cy="78" r="6" fill="#f59e0b"/>
  <text x="120" y="83" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" letter-spacing="2">ENTERPRISE PLATFORM</text>

  <!-- Title & Subtitle -->
  <text x="80" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1">BrandMorph Studio</text>
  <text x="80" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">Enterprise Deck-to-Design-System Platform • W3C DTCG Token AST Compiler</text>

  <!-- Left Card: PowerPoint Decompilation -->
  <g transform="translate(80, 240)">
    <rect width="330" height="400" rx="20" fill="#0d1527" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect x="24" y="24" width="80" height="26" rx="6" fill="#ef4444" fill-opacity="0.2"/>
    <text x="36" y="42" font-family="monospace" font-size="11" font-weight="700" fill="#f87171">PPTX INPUT</text>
    <text x="24" y="85" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Legacy Slides</text>
    <text x="24" y="112" font-family="-apple-system, sans-serif" font-size="13" fill="#64748b">Raw XML &amp; Shape Trees</text>

    <!-- Mini mock presentation cards -->
    <rect x="24" y="140" width="282" height="60" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.05"/>
    <rect x="40" y="158" width="24" height="24" rx="4" fill="#f59e0b" fill-opacity="0.3"/>
    <rect x="76" y="162" width="120" height="8" rx="4" fill="#ffffff" fill-opacity="0.6"/>
    <rect x="76" y="176" width="70" height="6" rx="3" fill="#ffffff" fill-opacity="0.2"/>

    <rect x="24" y="215" width="282" height="60" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.05"/>
    <rect x="40" y="233" width="24" height="24" rx="4" fill="#06b6d4" fill-opacity="0.3"/>
    <rect x="76" y="237" width="140" height="8" rx="4" fill="#ffffff" fill-opacity="0.6"/>
    <rect x="76" y="251" width="90" height="6" rx="3" fill="#ffffff" fill-opacity="0.2"/>

    <rect x="24" y="290" width="282" height="80" rx="10" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.05"/>
    <text x="40" y="325" font-family="monospace" font-size="12" fill="#38bdf8">Parsed: 42 Shapes • 16 Fonts</text>
    <text x="40" y="348" font-family="monospace" font-size="11" fill="#4ade80">AST Conversion: READY</text>
  </g>

  <!-- Middle Card: Design Token AST -->
  <g transform="translate(460, 240)">
    <rect width="360" height="400" rx="20" fill="#0d1527" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="24" y="24" width="90" height="26" rx="6" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="34" y="42" font-family="monospace" font-size="11" font-weight="700" fill="#fbbf24">DTCG AST</text>
    <text x="24" y="85" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Token Tree AST</text>
    <text x="24" y="112" font-family="-apple-system, sans-serif" font-size="13" fill="#64748b">W3C Design Token Engine</text>

    <!-- Code Block in Middle Card -->
    <rect x="24" y="135" width="312" height="235" rx="12" fill="#050811" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="40" y="165" font-family="monospace" font-size="11" fill="#94a3b8">// Token Schema Extraction</text>
    <text x="40" y="190" font-family="monospace" font-size="11" fill="#f59e0b">{</text>
    <text x="56" y="215" font-family="monospace" font-size="11" fill="#38bdf8">"color": {</text>
    <text x="72" y="240" font-family="monospace" font-size="11" fill="#e2e8f0">"brand": { "$value": "#0052CC" },</text>
    <text x="72" y="265" font-family="monospace" font-size="11" fill="#e2e8f0">"accent": { "$value": "#F59E0B" }</text>
    <text x="56" y="290" font-family="monospace" font-size="11" fill="#38bdf8">},</text>
    <text x="56" y="315" font-family="monospace" font-size="11" fill="#a78bfa">"radius": { "$value": "12px" }</text>
    <text x="40" y="340" font-family="monospace" font-size="11" fill="#f59e0b">}</text>
  </g>

  <!-- Right Card: React 19 Studio Output -->
  <g transform="translate(870, 240)">
    <rect width="330" height="400" rx="20" fill="#0d1527" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="24" y="24" width="110" height="26" rx="6" fill="#10b981" fill-opacity="0.2"/>
    <text x="34" y="42" font-family="monospace" font-size="11" font-weight="700" fill="#34d399">REACT 19 + TW</text>
    <text x="24" y="85" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Interactive Studio</text>
    <text x="24" y="112" font-family="-apple-system, sans-serif" font-size="13" fill="#64748b">Live Component Synthesis</text>

    <!-- Component preview block -->
    <rect x="24" y="140" width="282" height="150" rx="12" fill="#050811" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="48" cy="165" r="4" fill="#ef4444"/>
    <circle cx="62" cy="165" r="4" fill="#f59e0b"/>
    <circle cx="76" cy="165" r="4" fill="#10b981"/>
    
    <rect x="40" y="185" width="180" height="24" rx="6" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-opacity="0.4"/>
    <text x="52" y="202" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#93c5fd">Enterprise Deck Studio</text>
    <rect x="40" y="222" width="250" height="10" rx="4" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="40" y="242" width="190" height="10" rx="4" fill="#ffffff" fill-opacity="0.05"/>
    <rect x="40" y="262" width="130" height="10" rx="4" fill="#ffffff" fill-opacity="0.05"/>

    <rect x="24" y="310" width="282" height="60" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3"/>
    <text x="40" y="345" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#34d399">✓ Zero Token Drift Verified</text>
  </g>
</svg>
