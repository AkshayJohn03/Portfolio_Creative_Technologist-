<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgQ" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080714"/>
      <stop offset="50%" stop-color="#0e0c1f"/>
      <stop offset="100%" stop-color="#070611"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glowQ" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgQ)"/>

  <!-- Radial Glow Accents -->
  <circle cx="240" cy="180" r="200" fill="#a855f7" opacity="0.14" filter="url(#glowQ)"/>
  <circle cx="1040" cy="500" r="240" fill="#10b981" opacity="0.1" filter="url(#glowQ)"/>

  <!-- Grid overlay -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="720"/>
    <line x1="240" y1="0" x2="240" y2="720"/>
    <line x1="400" y1="0" x2="400" y2="720"/>
    <line x1="560" y1="0" x2="560" y2="720"/>
    <line x1="720" y1="0" x2="720" y2="720"/>
    <line x1="880" y1="0" x2="880" y2="720"/>
    <line x1="1040" y1="0" x2="1040" y2="720"/>
    <line x1="1200" y1="0" x2="1200" y2="720"/>
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
  </g>

  <!-- Top Header Badge -->
  <rect x="80" y="60" width="230" height="36" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
  <circle cx="102" cy="78" r="6" fill="#a855f7"/>
  <text x="120" y="83" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" letter-spacing="2">QLOO HACKATHON</text>

  <!-- Title & Subtitle -->
  <text x="80" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1">Quorum</text>
  <text x="80" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">Agentic Focus Group in a Box • 250M-Entity Qloo Taste Graph • GO / PIVOT / NO-GO Verdicts</text>

  <!-- Left Card: Multi-Agent Network -->
  <g transform="translate(80, 240)">
    <rect width="450" height="400" rx="20" fill="#131026" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect x="24" y="24" width="130" height="26" rx="6" fill="#8b5cf6" fill-opacity="0.2"/>
    <text x="34" y="42" font-family="monospace" font-size="11" font-weight="700" fill="#c084fc">AGENT CONSENSUS</text>
    <text x="24" y="85" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Autonomous Personas</text>
    <text x="24" y="112" font-family="-apple-system, sans-serif" font-size="13" fill="#64748b">Grounded in 250M-Entity Taste Matrix</text>

    <!-- Node connections -->
    <line x1="225" y1="210" x2="100" y2="280" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.5"/>
    <line x1="225" y1="210" x2="350" y2="280" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.5"/>
    <line x1="225" y1="210" x2="225" y2="330" stroke="#10b981" stroke-width="2" stroke-opacity="0.8"/>

    <!-- Center Node (Product Target) -->
    <circle cx="225" cy="210" r="32" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="2"/>
    <text x="225" y="215" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Feature Spec</text>

    <!-- Persona 1 (Minimalist) -->
    <g transform="translate(100, 280)">
      <circle cx="0" cy="0" r="26" fill="#0c1322" stroke="#38bdf8" stroke-width="2"/>
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="9" fill="#38bdf8">Persona 1</text>
      <text x="0" y="42" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">The Minimalist</text>
    </g>

    <!-- Persona 2 (Trendsetter) -->
    <g transform="translate(350, 280)">
      <circle cx="0" cy="0" r="26" fill="#0c1322" stroke="#ec4899" stroke-width="2"/>
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="9" fill="#ec4899">Persona 2</text>
      <text x="0" y="42" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">The Trendsetter</text>
    </g>

    <!-- Persona 3 (Power User) -->
    <g transform="translate(225, 330)">
      <circle cx="0" cy="0" r="26" fill="#0c1322" stroke="#10b981" stroke-width="2"/>
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="9" fill="#10b981">Persona 3</text>
      <text x="0" y="42" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">The Power User</text>
    </g>
  </g>

  <!-- Right Card: Verdict HUD (GO / PIVOT / NO-GO) -->
  <g transform="translate(560, 240)">
    <rect width="640" height="400" rx="20" fill="#131026" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="24" y="24" width="130" height="26" rx="6" fill="#10b981" fill-opacity="0.2"/>
    <text x="34" y="42" font-family="monospace" font-size="11" font-weight="700" fill="#34d399">VERDICT ENGINE</text>
    <text x="24" y="85" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Verdict HUD</text>
    <text x="24" y="112" font-family="-apple-system, sans-serif" font-size="13" fill="#64748b">Instant Data-Grounded Decision Protocol</text>

    <!-- Verdict Indicator Buttons -->
    <g transform="translate(24, 140)">
      <!-- GO Button (Active) -->
      <g transform="translate(0, 0)">
        <rect width="180" height="74" rx="14" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="2"/>
        <circle cx="34" cy="37" r="10" fill="#10b981"/>
        <text x="64" y="45" font-family="-apple-system, sans-serif" font-size="26" font-weight="800" fill="#34d399">GO</text>
        <text x="120" y="45" font-family="monospace" font-size="11" fill="#10b981">88%</text>
      </g>

      <!-- PIVOT Button -->
      <g transform="translate(200, 0)">
        <rect width="180" height="74" rx="14" fill="#f59e0b" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
        <circle cx="34" cy="37" r="10" fill="#f59e0b" fill-opacity="0.4"/>
        <text x="64" y="45" font-family="-apple-system, sans-serif" font-size="22" font-weight="700" fill="#94a3b8">PIVOT</text>
      </g>

      <!-- NO-GO Button -->
      <g transform="translate(400, 0)">
        <rect width="180" height="74" rx="14" fill="#ef4444" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
        <circle cx="34" cy="37" r="10" fill="#ef4444" fill-opacity="0.4"/>
        <text x="64" y="45" font-family="-apple-system, sans-serif" font-size="22" font-weight="700" fill="#94a3b8">NO-GO</text>
      </g>
    </g>

    <!-- Metrics Matrix in Right Card -->
    <g transform="translate(24, 240)">
      <rect width="590" height="130" rx="12" fill="#090714" stroke="#ffffff" stroke-opacity="0.06"/>
      
      <text x="24" y="32" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Qloo Cultural Affinity Vector</text>
      <text x="480" y="32" font-family="monospace" font-size="12" fill="#34d399">High Correlation (+0.84)</text>

      <rect x="24" y="50" width="540" height="8" rx="4" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="24" y="50" width="450" height="8" rx="4" fill="#10b981"/>

      <text x="24" y="90" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Product Launch Recommendation: <tspan fill="#ffffff" font-weight="600">Proceed to Beta with Tech &amp; Culture Enthusiast Segment</tspan></text>
      <text x="24" y="112" font-family="monospace" font-size="11" fill="#64748b">Entities Cross-Referenced: 1,420 • Taste Graph Latency: 240ms</text>
    </g>
  </g>
</svg>
